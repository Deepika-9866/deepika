<!DOCTYPE html>
<html>
<head>
    <title>Inline Elements</title>
    <style>
        span,strong{
            border: 1px solid red;
            padding: 5px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <u>Underline</u><br>
    <strong>Strong tag is applied here</strong><br>
    <em>Emphasise tag experiment</em><br>
    <small>Letters will be small</small><br>
    <mark>Words will be highlighted</mark><br>
    <label>Label tag is used</label><br>
    This is <span>in line.</span>

</body>
</html>
